<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Proyecto</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <header>
        <h1>Gestión de reservas</h1>
    <nav>
        <ul>
            <li><a href="#home" onclick="mostrarSeccion('home')">Inicio</a></li>
            <li><a href="#nueva-reserva" onclick="mostrarSeccion('nueva-reserva')">Nueva Reserva</a></li>
            <li><a href="#lista-reservas" onclick="mostrarSeccion('lista-reservas')">Lista de Reservas</a></li>
        </ul>
    </nav>
    </header>
    <main>
        <section id="home">
            <h2>Inicio</h2>
            <p>Bienvenido a la página de inicio.</p>
        </section>
        <section  id="nueva-reserva">
            <h2>Nueva Reserva</h2>
            <form id="formulario-reserva">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required>
                <label for="fecha">Fecha:</label>
                <input type="date" id="fecha" required>
                <label for="hora">Hora:</label>
                <input type="time" id="hora" required>
                <button type="submit">Agregar Reserva</button>
            </form>
        </section>
        <section id="lista-reservas" style="display: none;">
            <h2>Lista de Reservas</h2>
            <div id="lista-reservas-contenido"></div>
        </section>
    </main>
    <footer>
        <h3>Esto es el footer</h3>
    </footer>
</body>
</html>
